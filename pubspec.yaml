name: snap_cart
description: Ecommere merchandise for soni store.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cached_network_image: ^3.2.3
  cloud_firestore: ^6.8.0
  cupertino_icons: ^1.0.2
  dio: ^5.1.2
  dotenv: ^4.2.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^18.0.0
  flutter_rating_bar: ^4.0.1
  flutter_stripe: ^14.0.0
  flutter_svg: ^2.0.5
  webview_flutter: ^4.0.0
  font_awesome_flutter: ^11.0.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  get: ^4.6.1
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  google_sign_in: ^6.2.2
  http: ^1.1.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  provider: ^6.0.2
  # razorpay_flutter: ^1.3.5
  shared_preferences: ^2.1.1
  shimmer: ^3.0.0
  uuid: ^4.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
